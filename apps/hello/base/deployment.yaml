apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  annotations:
    argocd.argoproj.io/sync-wave: "1"  # after the ConfigMap (wave 0)
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      containers:
        - name: hello
          # podinfo: a tiny Go web app with a UI whose color/message come from env vars.
          image: ghcr.io/stefanprodan/podinfo:6.17.0
          ports:
            - name: http
              containerPort: 9898
          envFrom:
            - configMapRef:
                name: hello-config
          # Probes drive Argo CD's health status: the app is "Healthy" only
          # once the Deployment's pods are Ready.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
