# hello - STAGING overlay. Open http://localhost:8082
# Only what differs from the base lives here: replicas, UI color/message, nodePort.
# The target namespace (hello-staging) is set by the ApplicationSet, not here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

replicas:
  - name: hello
    count: 2

configMapGenerator:
  - name: hello-config
    behavior: merge
    literals:
      - PODINFO_UI_COLOR=#d69e2e  # yellow
      - PODINFO_UI_MESSAGE=hello staging - v1

patches:
  - target: { kind: Service, name: hello }
    patch: |
      - op: add
        path: /spec/ports/0/nodePort
        value: 30082
